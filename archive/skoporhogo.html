<style>
  :root{ --k:#000; --w:#fff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--k); color:var(--w);
    font-family:'VT323',ui-monospace,Menlo,Consolas,monospace; font-size:20px; line-height:1.1; }
  body{ display:flex; flex-direction:column; min-height:100vh; }
  header{ display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:2px solid var(--w); flex-wrap:wrap; }
  #speeds{ display:flex; gap:6px; flex-wrap:wrap; }
  button{ font:inherit; font-size:22px; background:var(--k); color:var(--w); border:2px solid var(--w);
    padding:2px 10px; cursor:pointer; border-radius:0; }
  button:hover{ background:var(--w); color:var(--k); }
  button.on{ background:var(--w); color:var(--k); }
  #lang{ margin-left:auto; }
  main{ flex:1; display:flex; gap:0; min-height:0; }
  #stage{ flex:1; display:flex; align-items:center; justify-content:center; min-width:0; padding:8px; }
  #view{ touch-action:none; image-rendering:pixelated; image-rendering:crisp-edges; display:block; cursor:pointer; border:2px solid var(--w); }
  aside{ width:360px; border-left:2px solid var(--w); padding:12px; display:flex; flex-direction:column; gap:12px; overflow:auto; }
  [hidden]{ display:none !important; }
  #card{ border:2px solid var(--w); padding:10px; }
  #cbody{ display:grid; grid-template-columns:112px 1fr; gap:4px 12px; align-items:start; }
  #pcv{ width:112px; height:112px; image-rendering:pixelated; display:block; border:2px solid var(--w); grid-row:1/4; }
  #cname{ font-size:28px; line-height:1; }
  #cact{ min-height:20px; font-size:19px; }
  #bars{ grid-column:1/3; margin-top:6px; }
  .bar{ display:flex; align-items:center; gap:8px; margin:3px 0; }
  .bar span{ width:96px; }
  .bar i{ flex:1; height:12px; border:2px solid var(--w); position:relative; }
  .bar b{ position:absolute; left:0; top:0; bottom:0; background:var(--w); }
  #hint{ display:none !important; }
  #roster{ display:grid; grid-template-columns:1fr; gap:4px; }
  .row{ display:grid; grid-template-columns:34px minmax(0,1fr) auto; grid-template-rows:auto auto; column-gap:8px; align-items:center;
    text-align:left; padding:3px 6px; font-size:19px; }
  .row img{ grid-row:1/3; width:34px; height:34px; image-rendering:pixelated; border:1px solid currentColor; }
  .row .nm{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rm{ font-size:15px; border:1px solid currentColor; padding:0 5px; white-space:nowrap; }
  .row .vb{ grid-column:2/4; font-size:17px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.on .vb{ opacity:1; }
  @media (max-width:1180px){ aside{ width:300px; } }
  @media (max-width:900px){
    main{ flex-direction:column; }
    #stage{ padding:2px; }
    aside{ width:auto; border-left:none; border-top:2px solid var(--w); overflow:visible; }
    #roster{ grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
    header{ padding:8px 16px; gap:8px; }
    button{ font-size:20px; padding:2px 8px; }
  }
</style>
<script src="../ascii-live.js" defer></script></head>

  </aside>
</main>

// ---------- A* (8-dir, no corner cutting) ----------
function findPath(sx,sz,tx,tz,avoid,self){
  if(!walk(tx,tz)) return null; if(sx===tx&&sz===tz) return [];
  const N=RW*RD, g=new Float32Array(N).fill(1e9), f=new Float32Array(N).fill(1e9), from=new Int16Array(N).fill(-1), closed=new Uint8Array(N);
  const open=[I(sx,sz)]; g[I(sx,sz)]=0; f[I(sx,sz)]=0;
  const h=(x,z)=>{ const dx=Math.abs(x-tx),dz=Math.abs(z-tz); return Math.max(dx,dz)+.414*Math.min(dx,dz); };
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(f[open[i]]<f[open[bi]]) bi=i;
    const cur=open.splice(bi,1)[0]; if(closed[cur]) continue; closed[cur]=1;
    const cx=cur%RW, cz=(cur/RW)|0;
    if(cx===tx&&cz===tz){ const p=[]; let c=cur; while(c!==I(sx,sz)){ p.push([c%RW,(c/RW)|0]); c=from[c]; } return p.reverse(); }
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
      if(!dx&&!dz) continue; const nx=cx+dx, nz=cz+dz; if(!walk(nx,nz)) continue;
      if(dx&&dz&&(!walk(cx+dx,cz)||!walk(cx,cz+dz))) continue;
      const ni=I(nx,nz); if(closed[ni]) continue;
      if(avoid && occ[ni]>=0 && occ[ni]!==self && !(nx===tx&&nz===tz)) continue;
      const ng=g[cur]+(dx&&dz?1.414:1)+(occ[ni]>=0&&occ[ni]!==self?.6:0);
      if(ng<g[ni]){ g[ni]=ng; f[ni]=ng+h(nx,nz); from[ni]=cur; open.push(ni); }
    }
  }
  return null;
}

    f.g.position.y=lying?-.3:(pose==='walk'?Math.abs(Math.cos(ph))*.02:(a.state==='do'&&a.act&&a.act.kind==='dance'?Math.abs(Math.sin(t*7))*.08:0));
    if(f.head){ f.head.rotation.x=lying?.25:Math.sin(t*.9+a.id)*.06; }
  } else if(f.type==='veil'){
    f.g.rotation.z=pose==='walk'?Math.sin(ph)*.05:(a.state==='do'&&a.act&&a.act.kind==='dance'?Math.sin(t*4)*.12:0); f.g.position.y=0;
  }
}
const angDiff=(a,b)=>{ let d=b-a; while(d>PI) d-=2*PI; while(d<-PI) d+=2*PI; return d; };
function visuals(rdt,t){
  for(const a of AG){
    const ac=a.act; let pose='stand', y=0;
    if(a.state==='walk'){ if(a.mv){ const m=a.mv; a.px=m.fx+.5+(m.tx-m.fx)*m.t; a.pz=m.fz+.5+(m.tz-m.fz)*m.t; pose='walk'; } else { a.px=a.cx+.5; a.pz=a.cz+.5; } }
    else if(a.state==='enter'||a.state==='exit'){ pose='walk'; }
    else if(a.state==='do'){
      if(a.inAnchor&&ac&&ac.spot){ const s=ac.spot; a.px=s.anchor.x; a.pz=s.anchor.z; pose=s.pose; y=s.anchor.y; a.tyaw=s.yaw; }
      else { a.px=a.cx+.5; a.pz=a.cz+.5;
        if(ac){ if(ac.spot){ pose=ac.spot.pose; a.tyaw=ac.spot.yaw; } else { if(ac.pose) pose=ac.pose; if(ac.yaw!=null) a.tyaw=ac.yaw; }
          if(ac.kind==='sleep'&&!ac.standing) pose='lie'; if(ac.kind==='sleep'&&ac.standing) pose='stand';
          if(ac.kind==='queue') a.tyaw=ac.spot.yaw; }
      }
      if(a.d.noSeat && pose==='floor') pose=a.figs[0].type==='bull'?'lie':'stand';
    }
    if(a.state==='do'&&ac&&ac.kind==='dance'&&ac.spot) a.tyaw=ac.spot.yaw+Math.sin(t*.9+a.id)*1.6;
    a.pose=pose;
    a.yaw+=angDiff(a.yaw,a.tyaw)*Math.min(1,rdt*10);
    a.root.position.set(a.px,0,a.pz); a.root.rotation.y=a.yaw;
    const P=a.poseG; P.rotation.set(0,0,0); P.position.set(0,0,0);
    const hip=.44*a.s;
    if(pose==='sit'){ P.position.y=y-hip+.02; }
    else if(pose==='floor'){ P.position.y=-hip+.06*a.s; }
    else if(pose==='lie'){
      if(a.figs[0].type==='bull'){ P.position.y=y; }
      else { P.rotation.x=-PI/2; P.position.set(0,y+.1*a.s,(a.figs[0].type==='veil'?.6*CS:.53*a.s)); }
    }
    for(const f of a.figs){ poseFig(f,pose,a.ph,a,t); if(f.fx) f.fx(t,{moving:pose==='walk'}); }
    // sleeping in a chair: droop head
    for(const f of a.figs) if(f.head&&f.type==='human') f.head.rotation.x=(ac&&ac.kind==='sleep'&&pose==='sit')?.45:(a.state==='do'&&ac&&(ac.kind==='chess'||ac.kind==='read')&&pose!=='lie')?.3:0;
    // bubble & particles
    const chatting=a.state==='do'&&ac&&ac.kind==='chat';
    a.bub.visible=chatting&&((Math.floor(t*.7)+a.id)%2===0);
    if(t-a.lastFx>1.4 && a.state==='do'&&ac&&ac.kind==='sleep'){ a.lastFx=t+R(0,.8); const hy=pose==='lie'?y+.4:a.top; puff(a.px+R(-.1,.1),hy,a.pz+(pose==='lie'?-.45:0),'z'); }
    if(t-a.lastFx>.55 && a.state==='do'&&ac&&ac.kind==='smoke'){ a.lastFx=t; puff(a.px+Math.sin(a.yaw)*.25,1.0,a.pz+Math.cos(a.yaw)*.25,'smoke'); }
    if(t-a.lastFx>.7 && a.state==='do'&&ac&&ac.kind==='tinker'){ a.lastFx=t; puff(a.px+Math.sin(a.yaw)*.55,.5,a.pz+Math.cos(a.yaw)*.55,'spark'); }
  }
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.t+=rdt; p.o.position.y+=p.vy*rdt; if(p.kind==='smoke') p.o.scale.setScalar(1+p.t*1.4);
    if(p.t>p.life){ scene.remove(p.o); fx.splice(i,1); } }
  // bathroom door
  const near=AG.some(a=>Math.abs(a.px-2.5)<.7&&Math.abs(a.pz-3.0)<.75);
  const tgt=near?1.45:0; bathDoor.rotation.y+=(tgt-bathDoor.rotation.y)*Math.min(1,rdt*8);
  // selection pointer
  const sel=AG[selected];
  if(sel){ ptr.visible=true; let py=sel.top+.25; if(sel.pose==='lie') py=sel.poseG.position.y+.65; if(sel.pose==='sit') py=sel.poseG.position.y+sel.top+.2; if(sel.pose==='floor') py=sel.top-.2;
    ptr.position.set(sel.px,py+Math.sin(t*4)*.05,sel.pz); ptr.rotation.y=t*2; } else ptr.visible=false;
}

// ---------- environment (time of day, TV, lamps) ----------
let tvOn=false, tvTick=0;
function environment(rdt,t){
  const h=hour();
  const day=sstep(5.5,7.5,h)*(1-sstep(18.5,20.5,h));
  hemi.intensity=.3+.42*day;
  const ts=clamp((h-6)/14,0,1);
  if(day>.05){ sun.position.set(7+(ts-.5)*14,9+5*Math.sin(PI*ts),-9); sun.intensity=.15+day*.95; }
  else { sun.position.set(9,10,-9); sun.intensity=.18; }
  { const dusk=Math.max(0,1-Math.abs(day-.45)*3.2);
    skyMat.color.setRGB(.04+.5*day,.06+.74*day,.16+.82*day).lerp(new THREE.Color('#ff8a4a'),dusk*.7); }
  moon.visible=day<.35; stars.forEach(s=>s.visible=day<.2);
  const lampOn=(h>=18.3||h<.4)||(h>=5.8&&h<7.2);
  lampL.intensity=lampOn?2.2:0; lampShadeMat.emissive.setRGB(lampOn?1:0,lampOn?.78:0,lampOn?.42:0);
  tvOn=AG.some(a=>a.state==='do'&&a.act&&a.act.kind==='tv');
  if(tvOn){ tvTick+=rdt; if(tvTick>.09){ tvTick=0; const x=tvNoise.x; const id=x.createImageData(32,16); const b=Math.random()*.5+.3;
      for(let i=0;i<512;i++){ const v=Math.random()<b?1:0, h=(i>>3)%4; id.data[i*4]=v*(h===1?255:160); id.data[i*4+1]=v*(h===2?255:190); id.data[i*4+2]=v*255; id.data[i*4+3]=255; }
      x.putImageData(id,0,0); tvNoise.t.needsUpdate=true; }
    screenMat.map=tvNoise.t; screenMat.color.setScalar(1); tvL.intensity=1.6+Math.random()*1.2; }
  else { screenMat.map=null; screenMat.color.setScalar(.13); tvL.intensity=0; }
  screenMat.needsUpdate=true;
  vcrDot.visible=tvOn&&(Math.floor(t*2)%2===0);
  const bathBusy=AG.some(a=>a.inAnchor&&a.act&&a.act.kind==='bath');
  bathL.intensity=bathBusy?2:0;
  const jukeOn=AG.some(a=>a.state==='do'&&a.act&&a.act.kind==='dance');
  const beat=Math.floor(t*2.2);
  jukeBars.forEach((m,i)=>m.color.set(jukeOn?['#ff4a8a','#ffe040','#4ae0ff','#40ff90','#8a5aff'][(beat+i)%5]:'#5a2a3a'));
  danceMat.emissive.setScalar(jukeOn?(.55+.35*Math.sin(t*8.8)):0); if(jukeOn) danceTex.offset.set((beat%4)*.25,0);
  jukeL.intensity=jukeOn?1.4+Math.sin(t*8.8)*.6:0; if(jukeOn) jukeL.color.set(['#ff4a8a','#4ae0ff','#ffe040'][beat%3]);
  let anyPlay=false;
  arcade.forEach((ar,i)=>{ const on=AG.some(a=>a.state==='do'&&a.act&&a.act.kind==='play'&&a.act.spot&&a.act.spot.cab===i); anyPlay=anyPlay||on;
    ar.ph+=rdt*(on?6:1.2); if(Math.floor(ar.ph*3)!==ar.last){ ar.last=Math.floor(ar.ph*3); const x=ar.x;
      x.fillStyle='#05050c'; x.fillRect(0,0,24,18);
      const cols=['#ff4a8a','#40ff90','#ffe040','#4ae0ff'];
      for(let r=0;r<3;r++) for(let c=0;c<5;c++){ x.fillStyle=cols[(r+i)%4]; x.fillRect(2+c*4+((ar.last%4)<2?0:1),2+r*3,2,2); }
      x.fillStyle='#ffffff'; x.fillRect(((ar.last*(on?3:1))%20)+1,15,3,2); if(on&&ar.last%2) x.fillRect(11,9,1,4);
      ar.t.needsUpdate=true; }
    ar.mq.color.setScalar(1).multiplyScalar(on||Math.floor(t*1.5+i)%2?1:.6); });
  arcadeL.intensity=anyPlay?1.2:.45;
  const cooking=AG.some(a=>a.state==='do'&&a.act&&a.act.kind==='cook'&&a.cx===13);
  burnerMat.emissive.setRGB(cooking?.9:0,cooking?.25:0,0);
  kitchenL.intensity=((h>=18.3||h<.5)||(h>=5.8&&h<8)||AG.some(a=>a.state==='do'&&a.act&&(a.act.kind==='cook'||a.act.kind==='eat')))&&day<.6?2:0;
  const chessOn=AG.filter(a=>a.state==='do'&&a.act&&a.act.kind==='chess'&&a.inAnchor).length>=2;
  if(chessOn&&Math.random()<rdt*.6){ const pc=pick(chessPieces); let [gx,gz]=pc.userData.g; gx=clamp(gx+((Math.random()*3)|0)-1,0,7); gz=clamp(gz+(Math.random()<.5?1:-1),0,7);
    pc.userData.g=[gx,gz]; pc.position.x=9.22+.035+gx*.07; pc.position.z=4.22+.035+gz*.07; }
  const flick=Math.random()<.01; neon.visible=!flick; neonL.intensity=day<.5&&!flick?1:0;
}

// =========================================================
//  UI
// =========================================================
const SPEEDS=[0,1,4,15,60]; let speedI=1, selected=-1;
const speedsEl=document.getElementById('speeds');
SPEEDS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=s?('×'+s):'❚❚'; b.onclick=()=>setSpeed(i); speedsEl.appendChild(b); });
const zoomEl=document.getElementById('zoom');
[['−',-1],['＋',1]].forEach(([t,d])=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>zoomAt(d>0?1.4:1/1.4,0,0); zoomEl.appendChild(b); });
function zoomAt(f,mx,my){ // mx,my in NDC
  const c=CAM0, oz=VIEW.z, nz=clamp(oz*f,1,3.2); if(nz===oz) return;
  const wx=c.cx+VIEW.x+mx*c.hw/oz, wy=c.cy+VIEW.y+my*c.hh/oz;
  VIEW.z=nz; VIEW.x=wx-c.cx-mx*c.hw/nz; VIEW.y=wy-c.cy-my*c.hh/nz; applyView(); }
function setSpeed(i){ speedI=i; [...speedsEl.children].forEach((b,k)=>b.classList.toggle('on',k===i)); }
setSpeed(1);
function roomOf(a){ return (a.px<3.05&&a.pz<3.05)?1:(a.px>12.1?2:0); }
function verb(a){
  const L=TXT[lang], ac=a.act; if(!ac) return L.v.idle;
  const k=ac.kind, nm=ac.partner?ac.partner.d.n:'';
  if(a.state==='leave'||a.state==='exit') return L.leave;
  if(a.state==='walk'||(a.state==='enter'&&k!=='bath')){ if(k==='wander') return L.v.wander; return (L.go[k]||L.v[k]||'').replace('{n}',nm); }
  if(k==='bath'&&ac.spot) return L.v[['toilet','sink','tub'][bathSpots.indexOf(ac.spot)]];
  if(k==='sleep'&&ac.standing) return L.v.sleepStand;
  if(k==='chess') return ac.partner?L.v.chess.replace('{n}',nm):L.v.chessWait;
  if(k==='read'&&ac.spot&&ac.spot.kind==='sleep') return L.v.readBed;
  if(k==='rest') return (ac.spot&&ac.spot.q>=3)?L.v.rest:L.v.restCouch;
  return (L.v[k]||'').replace('{n}',nm);
}
const roster=document.getElementById('roster'); const rows=[];
AG.forEach(a=>{ const b=document.createElement('button'); b.className='row'; b.onclick=()=>select(a.id);
  b.innerHTML=`<img alt="" src="${PORTRAITS[a.d.k]}"><span class="nm"></span><span class="rm"></span><span class="vb"></span>`;
  b.querySelector('.nm').textContent=a.d.n; roster.appendChild(b); rows.push({b,vb:b.querySelector('.vb'),rm:b.querySelector('.rm'),lv:'',lr:''}); });
function updateRoster(){
  const L=TXT[lang];
  AG.forEach((a,i)=>{ const r=rows[i], v=verb(a), rm=L.rooms[roomOf(a)];
    if(v!==r.lv){ r.vb.textContent=v; r.lv=v; } if(rm!==r.lr){ r.rm.textContent=rm; r.lr=rm; } });
}
const pcv=document.getElementById('pcv');
function select(i){ selected=(selected===i)?-1:i; VIEW.follow=selected>=0; rows.forEach((r,k)=>r.b.classList.toggle('on',k===selected));
  document.getElementById('hint').hidden=selected>=0; document.getElementById('cbody').hidden=selected<0; document.getElementById('card').hidden=selected<0;
  if(selected>=0){ pcv.src=PORTRAITS[AG[selected].d.k]; pcv.alt=AG[selected].d.n;
    document.getElementById('cname').textContent=AG[selected].d.n; }
  updateCard(); }
const barsEl=document.getElementById('bars');
function updateCard(){
  const L=TXT[lang]; document.getElementById('hint').textContent=L.hint; updateRoster();
  if(selected<0) return; const a=AG[selected];
  document.getElementById('cact').textContent=verb(a)+' · '+L.rooms[roomOf(a)];
  const v=[a.n.e,a.n.b,a.n.h,a.n.f,a.n.s];
  barsEl.innerHTML=L.needs.map((nm,i)=>`<div class="bar"><span>${nm}</span><i><b style="width:${Math.round(v[i]*100)}%"></b></i></div>`).join('');
}
const langBtn=document.getElementById('lang');
function applyLang(){ langBtn.textContent=lang==='en'?'FR':'EN'; document.documentElement.lang=lang; updateCard(); }
langBtn.onclick=()=>{ lang=lang==='en'?'fr':'en'; try{ localStorage.setItem('kf-room-lang',lang); localStorage.setItem('ik.lang',lang); }catch(e){} applyLang(); };
applyLang();
document.getElementById('hint').textContent=TXT[lang].hint;

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let drag=null;
view.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,vx:VIEW.x,vy:VIEW.y,moved:false}; view.setPointerCapture(e.pointerId); });
view.addEventListener('pointermove',e=>{ if(!drag) return; const r=view.getBoundingClientRect(); const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>4) drag.moved=true;
  if(drag.moved&&VIEW.z>1){ VIEW.follow=false; VIEW.x=drag.vx-dx/r.width*2*CAM0.hw/VIEW.z; VIEW.y=drag.vy+dy/r.height*2*CAM0.hh/VIEW.z; applyView(); } });
view.addEventListener('pointerup',e=>{ const d=drag; drag=null; if(d&&!d.moved) pickAt(e); });
view.addEventListener('wheel',e=>{ e.preventDefault(); const r=view.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.15:1/1.15,((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); },{passive:false});
function pickAt(e){
  const r=view.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,cam);
  const hits=ray.intersectObjects(AG.map(a=>a.root),true).filter(h=>h.object.userData.agent!=null&&h.object.visible&&!(h.object.isSprite));
  if(hits.length) select(hits[0].object.userData.agent);
  else { // nearest on screen within 24px
    let best=-1,bd=1e9; const v=new THREE.Vector3();
    for(const a of AG){ v.set(a.px,.5,a.pz).project(cam); const dx=(v.x-mouse.x)*r.width/2, dy=(v.y-mouse.y)*r.height/2, d=Math.hypot(dx,dy); if(d<bd){ bd=d; best=a.id; } }
    if(bd<26*VIEW.z) select(best);
  }
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); setSpeed(speedI===0?1:0); }
  const n=parseInt(e.key,10); if(n>=1&&n<=4) setSpeed(n);
  if(e.key==='Escape'&&selected>=0) select(selected);
  if(e.key==='+'||e.key==='=') zoomAt(1.4,0,0); if(e.key==='-') zoomAt(1/1.4,0,0);
});

function fit(){
  const st=document.getElementById('stage'), mob=innerWidth<=900;
  const aw=st.clientWidth-(mob?4:20), ah=mob?innerHeight*.62:Math.max(240,st.clientHeight-20);
  let k=Math.min(aw/W,ah/H); if(k>=1) k=Math.floor(k*4)/4;
  view.style.width=Math.round(W*k)+'px'; view.style.height=Math.round(H*k)+'px';
}
addEventListener('resize',fit); fit();


// =========================================================
//  LOOP
// =========================================================
let last=performance.now(), cardT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000); last=now; const t=now/1000;
  let g=rdt*SPEEDS[speedI];
  while(g>0){ const s=Math.min(g,.2); stepSim(s); g-=s; }
  visuals(rdt,t); environment(rdt,t);
  if(VIEW.follow&&selected>=0&&VIEW.z>1.01){ const a=AG[selected], v=new THREE.Vector3(a.px,.6,a.pz).applyMatrix4(cam.matrixWorldInverse);
    VIEW.x+=(v.x-CAM0.cx-VIEW.x)*Math.min(1,rdt*3); VIEW.y+=(v.y-CAM0.cy-VIEW.y)*Math.min(1,rdt*3); applyView(); }
  cardT+=rdt; if(cardT>.25){ cardT=0; updateCard(); }
  renderer.setRenderTarget(rt); renderer.render(scene,cam);
  renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__room={step:stepSim,AG,SP,setSpeed,get tMin(){return tMin;},set tMin(v){tMin=v;},occ,select};
})();
